name: pnode-pulse

services:
  # PostgreSQL + TimescaleDB
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: pnode-pulse-postgres
    restart: unless-stopped
    # No host port published: reached internally at postgres:5432.
    # Keeps the DB off the host (more secure) and avoids host-port churn on deploys.
    environment:
      POSTGRES_USER: pnodepulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pnodepulse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pnode-pulse-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pnodepulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: pnode-pulse-redis
    restart: unless-stopped
    # No host port published: reached internally at redis:6379.
    volumes:
      - redis_data:/data
    networks:
      - pnode-pulse-net
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Staging (dev branch)
  staging:
    image: ghcr.io/rector-labs/pnode-pulse:dev
    container_name: pnode-pulse-web-staging
    restart: unless-stopped
    ports:
      - "7002:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://pnodepulse:${POSTGRES_PASSWORD}@postgres:5432/pnodepulse
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NEXT_PUBLIC_APP_URL: https://staging.pulse.rectorspace.com
    networks:
      - pnode-pulse-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Production web (single container).
  # Deploys recreate ONLY this service via `docker compose up -d --no-deps green`
  # (see scripts/deploy.sh), so postgres/redis are never disturbed by a web deploy.
  # nginx points at host port 7001 permanently — no upstream switching.
  green:
    image: ghcr.io/rector-labs/pnode-pulse:latest
    container_name: pnode-pulse-web-green
    restart: unless-stopped
    ports:
      - "7001:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://pnodepulse:${POSTGRES_PASSWORD}@postgres:5432/pnodepulse
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NEXT_PUBLIC_APP_URL: https://pulse.rectorspace.com
    networks:
      - pnode-pulse-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Data collector worker — polls pNodes via pRPC and writes metrics/peers to the DB.
  # Built from the `collector` Dockerfile target (tsx + the worker code). Core service:
  # deployed via deploy-collector.yml; the web deploy (`up -d --no-deps green`) never
  # touches it. No host ports — reaches postgres/redis on the internal network.
  collector:
    image: ghcr.io/rector-labs/pnode-pulse-collector:latest
    container_name: pnode-pulse-collector
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://pnodepulse:${POSTGRES_PASSWORD}@postgres:5432/pnodepulse
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - pnode-pulse-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # pulse-api (lean Hono service hosting the tRPC server)
  # Tier 2 of the Vercel migration — see docs/VERCEL_CUTOVER_RUNBOOK.md.
  # Bound to 127.0.0.1 so nginx is the only public ingress.
  pulse-api:
    image: ghcr.io/rector-labs/pulse-api:latest
    container_name: pnode-pulse-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:7004:7004"
    environment:
      NODE_ENV: production
      PORT: 7004
      DATABASE_URL: postgresql://pnodepulse:${POSTGRES_PASSWORD}@postgres:5432/pnodepulse
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: pnode-pulse
      JWT_AUDIENCE: pnode-pulse-app
      ALLOWED_ORIGINS: https://pulse.rectorspace.com,https://staging.pulse.rectorspace.com
      LOG_LEVEL: info
    networks:
      - pnode-pulse-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:7004/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    profiles:
      - pulse-api

volumes:
  postgres_data:
    name: pnode-pulse-postgres-data
  redis_data:
    name: pnode-pulse-redis-data

networks:
  pnode-pulse-net:
    driver: bridge
    name: pnode-pulse-network
