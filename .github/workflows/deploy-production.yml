name: Deploy Production (Blue/Green)

on:
  workflow_dispatch:  # Manual trigger available
  push:
    branches: [main]  # Auto-deploy on main push

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=prod-
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Direct SSH to the VPS public IP is blocked by the firewall. Operators
      # SSH via the Cloudflare Tunnel (`ssh.rectorspace.com` → VPS:22), so CI
      # uses the same path. Tunnel is a public route; SSH key auth (VPS_SSH_KEY)
      # remains the only authentication.
      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o /tmp/cloudflared.deb
          sudo dpkg -i /tmp/cloudflared.deb
          cloudflared --version

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy to VPS (Blue/Green Production via CF Tunnel)
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ProxyCommand="cloudflared access ssh --hostname=ssh.rectorspace.com" \
              -i ~/.ssh/id_ed25519 \
              pnodepulse@ssh.rectorspace.com bash -s <<'REMOTE'
          set -euo pipefail
          cd ~/pnode-pulse
          git pull origin main
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ghcr.io/rector-labs/pnode-pulse:latest
          bash scripts/blue-green-deploy.sh
          docker image prune -f
          REMOTE

      - name: Verify deployment
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ProxyCommand="cloudflared access ssh --hostname=ssh.rectorspace.com" \
              -i ~/.ssh/id_ed25519 \
              pnodepulse@ssh.rectorspace.com bash -s <<'REMOTE'
          set -euo pipefail
          cd ~/pnode-pulse
          docker compose ps blue green
          docker compose logs --tail 20 blue green
          REMOTE
