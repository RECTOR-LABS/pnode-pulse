name: Deploy pulse-api

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/pulse-api/**"
      - "packages/pulse-types/**"
      - "prisma/schema.prisma"
      - ".github/workflows/deploy-pulse-api.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: rector-labs/pulse-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Required so build-push-action can use cache-from/cache-to: type=gha.
      # The default docker driver does not support GHA cache export.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push pulse-api image
        uses: docker/build-push-action@v5
        with:
          # Build context is the REPO ROOT so the Dockerfile can pick up
          # both packages/pulse-api/ and the shared prisma/ schema.
          context: .
          file: packages/pulse-api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=pulse-api
          cache-to: type=gha,mode=max,scope=pulse-api

      # Direct SSH to the VPS public IP is blocked by the firewall. Operators
      # SSH via the Cloudflare Tunnel (`ssh.rectorspace.com` → VPS:22), so CI
      # uses the same path. Tunnel is a public route; SSH key auth (VPS_SSH_KEY)
      # remains the only authentication.
      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o /tmp/cloudflared.deb
          sudo dpkg -i /tmp/cloudflared.deb
          cloudflared --version

      - name: Load VPS SSH key into ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy pulse-api to VPS (via CF Tunnel)
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
              -o ProxyCommand="cloudflared access ssh --hostname=ssh.rectorspace.com" \
              pnodepulse@ssh.rectorspace.com bash -s <<'REMOTE'
          set -euo pipefail
          cd ~/pnode-pulse

          git fetch origin main
          git pull --ff-only origin main

          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ghcr.io/rector-labs/pulse-api:latest

          # `pulse-api` is behind a docker-compose profile so it doesn't start by accident.
          # Use --profile to bring it up alongside postgres/redis.
          docker compose --profile pulse-api up -d pulse-api

          # Wait for healthz to report green
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:7004/healthz >/dev/null; then
              echo "pulse-api healthy"; break
            fi
            echo "waiting for pulse-api… ($i/20)"; sleep 2
          done

          # Free disk
          docker image prune -f
          REMOTE

      - name: Verify deployment
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
              -o ProxyCommand="cloudflared access ssh --hostname=ssh.rectorspace.com" \
              pnodepulse@ssh.rectorspace.com bash -s <<'REMOTE'
          set -euo pipefail
          cd ~/pnode-pulse
          docker compose ps pulse-api
          docker compose logs --tail 30 pulse-api
          curl -fsS http://127.0.0.1:7004/healthz | head
          REMOTE
