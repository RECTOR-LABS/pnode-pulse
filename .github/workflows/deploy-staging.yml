name: Deploy Staging

on:
  workflow_dispatch:  # Manual trigger available
  push:
    branches: [dev]  # Auto-deploy on dev push

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=staging-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Direct SSH to the VPS public IP is blocked by the firewall. Operators
      # SSH via the Cloudflare Tunnel (`ssh.rectorspace.com` → VPS:22), so CI
      # uses the same path. Tunnel is a public route; SSH key auth (VPS_SSH_KEY)
      # remains the only authentication.
      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o /tmp/cloudflared.deb
          sudo dpkg -i /tmp/cloudflared.deb
          cloudflared --version

      - name: Load VPS SSH key into ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy to VPS (Staging via CF Tunnel)
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
              -o ProxyCommand="cloudflared access ssh --hostname=ssh.rectorspace.com" \
              pnodepulse@ssh.rectorspace.com bash -s <<'REMOTE'
          set -euo pipefail
          cd ~/pnode-pulse
          git pull origin dev
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ghcr.io/rector-labs/pnode-pulse:dev
          docker compose stop staging
          docker compose rm -f staging
          docker compose up -d --no-deps staging
          docker image prune -f
          sleep 5
          docker compose ps staging
          docker compose logs --tail 20 staging
          REMOTE
